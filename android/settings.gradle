include ':app'

def flutterProjectRoot = rootDir.parentFile.toPath()

def localProperties = new Properties()

def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

def flutterSdkPath = localProperties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterRoot = flutterSdkPath
apply from: "$flutterRoot/packages/flutter_tools/gradle/app_plugin_loader.gradle"
